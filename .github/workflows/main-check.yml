name: Manual Build APK (No Leaks)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Этот шаг намертво отключает LeakCanary в конфигурации зависимостей приложения
      - name: Disable LeakCanary
        run: |
          find . -name "build.gradle.kts" -type f -exec sed -i 's/libs.leakcanary.android/libs.empty.dependency/g' {} + || true

      - name: Build with Gradle
        run: ./gradlew :androidApp:assembleFdroidDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-no-leaks
          path: androidApp/build/outputs/apk/fdroid/debug/*.apk
