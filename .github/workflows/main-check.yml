name: Manual Build APK (Clean Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Этот шаг заставляет релизную сборку использовать стандартный отладочный ключ
      - name: Force Debug Signing for Release Build
        run: |
          echo "storeFile=debug.keystore" > keystore.properties
          echo "storePassword=android" >> keystore.properties
          echo "keyAlias=androiddebugkey" >> keystore.properties
          echo "keyPassword=android" >> keystore.properties

      - name: Build with Gradle
        run: ./gradlew :androidApp:assembleFdroidRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-clean-release
          path: androidApp/build/outputs/apk/fdroid/release/*.apk
